<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesinter</title>
<meta name="theme-color" content="#7c5cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0d0f14;--side:#12151c;--card:#171b24;--line:#232836;--fg:#eef1f7;--muted:#8891a4;--accent:#7c5cff;--accent2:#5b8cff;--other:#1d2230;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4f9;--side:#fff;--card:#fff;--line:#e3e6ee;--fg:#141823;--muted:#6b7385;--other:#eceef5;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f4f9;--side:#fff;--card:#fff;--line:#e3e6ee;--fg:#141823;--muted:#6b7385;--other:#eceef5;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:var(--fg)}
button{background:var(--other);border:1px solid var(--line);border-radius:12px;min-height:40px;padding:0 14px;cursor:pointer;transition:transform .1s,background .2s}
button:active{transform:scale(.97)}
button:hover{border-color:var(--accent)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;font-size:12px;font-family:ui-monospace,monospace}
/* iOS zoome automatiquement si la police d'un champ est < 16px : on la fixe à 16px */
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
#app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:minmax(0,1fr);position:fixed;inset:0;height:100%;height:100dvh;overflow:hidden}
#side,#chat{min-width:0;min-height:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
#side{background:var(--side);border-right:1px solid var(--line)}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #app.open #side{display:none}
  #app:not(.open) #chat{display:none}
}
.top{padding:max(14px,env(safe-area-inset-top,0px)) 16px 12px;display:grid;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800}
.brand h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
.search{position:relative}
.search input{padding-left:36px;background:var(--card)}
.search::before{content:"";position:absolute;left:13px;top:50%;width:12px;height:12px;margin-top:-8px;border:2px solid var(--muted);border-radius:50%}
#friends{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 8px 16px}
.sect{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 6px}
.fr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer;transition:background .15s}
.fr:hover{background:var(--card)}
.fr.on{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}
.grow{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:grid;justify-items:end;gap:4px;font-size:12px;color:var(--muted)}
.badge{background:var(--accent);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;position:relative;text-transform:uppercase}
.pres{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--side);background:var(--muted)}
.pres.live{background:var(--ok)}.pres.attente{background:var(--warn)}
#chat{background:var(--bg)}
.chead{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);background:var(--side)}
.chead .name{font-weight:700;font-size:16px}
#back{display:none;padding:0 10px}
@media (max-width:760px){#back{display:inline-flex}}
#msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:8px 0}
.bub{max-width:min(78%,520px);padding:9px 13px;border-radius:18px;background:var(--other);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap;animation:pop .18s ease-out}
.bub.me{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bub:not(.me){border-bottom-left-radius:6px}
.bub .t{display:flex;gap:6px;justify-content:flex-end;font-size:11px;opacity:.75;margin-top:3px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#compose{display:flex;align-items:flex-end;gap:10px;padding:10px 12px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--side)}
#text{flex:1;min-width:0;border-radius:18px;max-height:140px;min-height:44px;padding:11px 14px;resize:none}
#send{border-radius:999px;min-width:84px}
.welcome{margin:auto;text-align:center;display:grid;gap:12px;justify-items:center;padding:24px;max-width:420px}
.welcome h2{margin:0;font-size:22px}
.welcome p{margin:0;color:var(--muted)}
.bigmark{width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:30px;font-weight:800}
#overlay{position:fixed;inset:0;background:rgba(5,7,12,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#overlay[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .2s ease-out}
.card h2{margin:0;font-size:19px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px;border:1px solid var(--line)}
.tabs button{flex:1;border:none;background:transparent;min-height:36px}
.tabs button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.muted{color:var(--muted);font-size:13px;margin:0}
.err{color:var(--bad);font-size:13px;min-height:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px}
.menu button{width:100%;justify-content:flex-start;min-height:46px}
.menu button.danger{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.qr{display:grid;place-items:center;background:#fff;border-radius:16px;padding:12px;width:min(300px,100%);justify-self:center}
.qr svg{width:100%;height:auto;display:block}
.av{transition:transform .2s}
.fr:hover .av{transform:scale(1.04)}
.bub{box-shadow:0 1px 2px rgba(0,0,0,.18)}
.fr{transition:background .15s,transform .1s}
.fr:active{transform:scale(.99)}
#launch{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 20px max(24px,env(safe-area-inset-bottom,0px))}
#launch[hidden]{display:none}
.lcard{width:min(400px,100%);display:grid;gap:12px;justify-items:center;text-align:center;max-height:100%;overflow:auto}
.lcard h2{margin:6px 0 0;font-size:24px}
.lbtns{width:100%;display:grid;gap:10px}
.lbtns button{min-height:50px;font-size:16px}
.lbtns button.primary{font-weight:700}
button.danger{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.show{opacity:1}

/* ---------- Finition visuelle ---------- */
:root{--glass:rgba(18,21,28,.72);--ring:0 0 0 1px var(--line),0 8px 24px rgba(0,0,0,.18)}
:root[data-theme="light"]{--glass:rgba(255,255,255,.75)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--glass:rgba(255,255,255,.75)}}
body{-webkit-font-smoothing:antialiased;letter-spacing:.005em}
.top{padding-bottom:14px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
.logo{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.search input{border-radius:14px;background:var(--bg)}
.fr{margin:2px 0;padding:11px 12px;border-radius:16px}
.fr.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent 85%)}
.fr:hover{background:color-mix(in srgb,var(--accent) 08%,transparent)}
.nm{font-size:15px;letter-spacing:-.005em}
.sub{font-size:13px}
.badge{box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.av{box-shadow:0 2px 8px rgba(0,0,0,.2)}
.chead{background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);position:sticky;top:0;z-index:2;padding-bottom:12px}
.chead .name{font-size:16px;letter-spacing:-.01em}
#msgs{padding:16px 14px 20px;gap:4px;scroll-behavior:smooth}
.day{position:sticky;top:6px;z-index:1;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:var(--glass);box-shadow:var(--ring)}
.bub{max-width:min(80%,560px);padding:9px 14px 7px;font-size:15px;line-height:1.42;border-radius:20px;box-shadow:var(--ring)}
.bub.me{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
.bub:not(.me){border-bottom-left-radius:6px}
.bub.me{border-bottom-right-radius:6px}
.bub .t{font-size:11px;opacity:.7}
#compose{background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:10px 12px max(12px,env(safe-area-inset-bottom,0px));gap:8px}
#text{background:var(--card);border-radius:22px;box-shadow:inset 0 0 0 1px var(--line);padding:11px 16px;min-height:46px}
#text:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
#send{min-height:46px;min-width:0;padding:0 18px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
#send:disabled{box-shadow:none}
.welcome{padding:32px 24px}
.welcome h2{font-size:24px;letter-spacing:-.01em}
button{min-height:42px;border-radius:14px;font-weight:500}
button.primary{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.card{border-radius:26px;padding:22px}
.tabs{border-radius:16px}
#overlay{background:rgba(5,7,12,.55)}
.lcard h2{font-size:28px;letter-spacing:-.02em}
.menu button{border-radius:16px}
#toast{box-shadow:0 10px 30px rgba(0,0,0,.3)}
.fr,.bub,button,.card{transition-property:background,box-shadow,transform,border-color,color;transition-duration:.18s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#msgs{scroll-behavior:auto}}
@media (max-width:760px){
  .chead{padding-top:max(10px,env(safe-area-inset-top,0px))}
  #msgs{padding:12px 12px 16px}
  .bub{max-width:86%}
}
.from{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.pwrap{position:relative;margin-bottom:38px}
.pbanner{height:112px;border-radius:20px;background-size:cover;background-position:center}
.pwrap .av{position:absolute;left:16px;bottom:-38px;border:4px solid var(--card)}
.sw{width:30px;height:30px;min-height:0;padding:0;border-radius:50%}
.sw.on{outline:2px solid var(--fg);outline-offset:2px}
.codebig{font:700 30px/1 ui-monospace,monospace;letter-spacing:.22em;text-align:center;padding:18px 8px;border:1px dashed var(--accent);border-radius:18px;cursor:pointer}
.notice{align-self:center;display:grid;gap:8px;justify-items:center;text-align:center;color:var(--muted);font-size:13px;padding:10px}
#chPeer{cursor:pointer}
.bub.typing{display:flex;gap:4px;padding:12px 14px;width:max-content}
.bub.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.15s}.bub.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.bub img{display:block;max-width:100%;max-height:300px;border-radius:12px}
#pic{min-width:44px;padding:0}
/* ---------- Animations ---------- */
.bub{animation:none}
.bub.new{animation:msgIn .34s cubic-bezier(.2,.9,.3,1.25);transform-origin:left bottom}
.bub.me.new{transform-origin:right bottom}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:.6;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes splashIn{from{opacity:0;transform:scale(.6) rotate(-8deg)}60%{transform:scale(1.08) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
#overlay:not([hidden]){animation:fadeIn .2s}
#overlay:not([hidden]) .card{animation:cardIn .3s cubic-bezier(.2,.9,.3,1.1)}
#app.open #chat{animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
body.boot .fr{animation:rise .45s both}
body.boot .fr:nth-child(2){animation-delay:.06s}body.boot .fr:nth-child(3){animation-delay:.12s}
body.boot .fr:nth-child(4){animation-delay:.18s}body.boot .fr:nth-child(5){animation-delay:.24s}
body.boot .fr:nth-child(n+6){animation-delay:.3s}
button{transition:transform .12s}
button:active{transform:scale(.94)}
.fr:active{transform:scale(.98)}
#send:active{transform:scale(.88) rotate(-10deg)}
.codebig:active{transform:scale(.97)}
#toast{transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.3);transform:translateX(-50%) translateY(16px)}
#toast.show{transform:translateX(-50%) translateY(0)}
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;pointer-events:none;animation:splashOut .45s .95s forwards}
#splash img{width:120px;height:120px;border-radius:30px;box-shadow:0 18px 50px color-mix(in srgb,var(--accent) 45%,transparent);animation:splashIn .8s cubic-bezier(.2,.9,.3,1.2)}
/* ---------- Menu en feuille coulissante ---------- */
#launch{align-items:flex-end;padding:0;background:rgba(5,7,12,.5);backdrop-filter:blur(4px)}
#launch .lcard{width:min(520px,100%);max-height:88vh;max-height:88dvh;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:14px 20px max(24px,env(safe-area-inset-bottom,0px));box-shadow:0 -20px 60px rgba(0,0,0,.35)}
#launch .lcard::before{content:'';width:44px;height:5px;border-radius:5px;background:var(--line);margin-bottom:6px}
#launch:not([hidden]):not(.closing){animation:fadeIn .2s}
#launch:not([hidden]) .lcard{animation:sheetUp .38s cubic-bezier(.2,.9,.3,1)}
#launch.closing{animation:fadeOut .22s forwards}
#launch.closing .lcard{animation:sheetDown .22s ease-in forwards}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes handleBob{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-4px)}}
#sheetHandle{display:none}
@media (max-width:760px){
  #sheetHandle{display:grid;align-content:center;justify-items:center;gap:3px;position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:112px;height:34px;padding:5px 0 max(0px,env(safe-area-inset-bottom,0px));border:0;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 -6px 22px color-mix(in srgb,var(--accent) 45%,transparent);z-index:12;animation:handleBob 2.6s ease-in-out infinite}
  #sheetHandle i{display:block;width:24px;height:2.5px;border-radius:3px;background:#fff}
  #friends{padding-bottom:60px}
  body:has(#app.open) #sheetHandle{display:none}
}
.cem{width:24px;height:24px;object-fit:contain;vertical-align:-6px;margin:0 1px}
.cem.big{width:36px;height:36px;vertical-align:middle}
.bub img.cem{display:inline;width:24px;height:24px;max-height:none;border-radius:0}
.bub .jumbo img.cem{width:48px;height:48px;vertical-align:-10px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.eb{min-height:48px;font-size:24px;padding:0}
#emo{min-width:44px;padding:0}
/* ---------- Messagium ---------- */
#mgfx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fxp{position:fixed;line-height:1;will-change:transform}
.bub.typing{position:relative;overflow:visible}
.bub.typing[class*=mg-]{margin-top:34px}
.mgd,.fl{position:absolute;pointer-events:none;line-height:1}
.mg-monkey .mgd{left:16px;top:-32px;font-size:30px;transform-origin:50% 100%;animation:swing 1.1s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.mg-florist .mgd{left:calc(100% + 4px);bottom:0;font-size:28px}
.fl{top:-18px;font-size:17px;transform-origin:50% 100%;transform:scale(0);animation:grow 2.4s ease-in-out infinite}
@keyframes grow{0%,8%{transform:scale(0)}30%,78%{transform:scale(1)}100%{transform:scale(0)}}
.mg-rocket .mgd{left:0;top:-30px;font-size:26px;animation:fly 1.5s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(0,3px)}to{transform:translate(46px,-5px)}}
.mg-cat .mgd{left:calc(100% + 2px);bottom:-2px;font-size:28px}
.mg-cat .paw{left:28px;top:-22px;font-size:18px;transform-origin:50% 0;animation:swat .6s ease-in-out infinite alternate}
@keyframes swat{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.mg-cat i{animation-duration:.6s}
.mgcard{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:18px}
.mgcard.on{border-color:var(--accent)}
.mgcard .bub{margin-bottom:6px}
/* ---------- Forum ---------- */
#forum{position:fixed;inset:0;z-index:14;background:var(--bg);display:flex;flex-direction:column;animation:fadeIn .2s}
#forum[hidden]{display:none}
.fhead{display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top,0px)) 14px 12px;border-bottom:1px solid var(--line)}
.fhead h2{margin:0;font-size:20px}
#feed{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 110px;display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto}
.post{flex:none;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;animation:rise .35s both}
.post .ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post img.pimg{display:block;width:100%;height:auto;cursor:pointer}
.post .pt{padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.grow{flex:1;min-width:0}
.fab{position:fixed;left:18px;bottom:max(20px,env(safe-area-inset-bottom,0px));width:58px;height:58px;min-height:0;border-radius:50%;font-size:32px;line-height:1;padding:0;z-index:16;box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 50%,transparent)}

#callui{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(44px,env(safe-area-inset-top,0px)) 24px max(34px,env(safe-area-inset-bottom,0px));color:#fff;background:#0b0d16;overflow:hidden;animation:fadeIn .25s}

  const e=document.createElement(tag);

    if(v===undefined||v===null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);

const CAN_RELAY=!!(window.crypto&&crypto.subtle),subs={},keyCache={};

async function relayRaw(f,o){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await ckey(f),new TextEncoder().encode(JSON.stringify(o))));
  const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);

}
async function relaySub(f){
  if(!CAN_RELAY||!f.key||subs[f.id]===f.key)return;
  if(subs[f.id+'es'])subs[f.id+'es'].close();
  subs[f.id]=f.key;
  const es=new EventSource('https://ntfy.sh/'+await ftopic(f)+'/sse?since='+((S.rs&&S.rs[f.id])||'12h'));
  subs[f.id+'es']=es;
  es.onopen=()=>flushPending(f.id);
  es.onmessage=async ev=>{
    try{
      const d=JSON.parse(ev.data);if(d.event!=='message'||!d.message)return;
      const a=unb64(d.message);
      const p=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},await ckey(f),a.slice(12))));
      (S.rs=S.rs||{})[f.id]=d.time;
      if(p.pt){if(p.from!==S.me.id){if(p.pt==='post')onPost(f.id,p);else if(p.pt==='wp')onWp(f.id,p);else if(p.pt==='wpimg')onWpImg(f.id,p);else if(p.pt==='pdel'){S.posts=(S.posts||[]).filter(x=>!(x.id===p.id&&x.uid===f.id));saveData();renderForum();}}return;}
      if(p.sig){onSig(f,p);return;}
      if(p.del&&p.from!==S.me.id){delMsg(f.id,p.del);return;}
      if(p.from===S.me.id||typeof p.text!=='string')return;
      receive(f.id,{text:p.text,t:p.t,id:p.id});
    }catch(e){}
  };
}

function receive(id,m){
  if(m&&m.type==='typing'){typing[id]=Date.now();typingMg[id]=MGIDS.includes(m.mg)?m.mg:null;if(cur===id)renderChat();setTimeout(()=>{if(cur===id&&Date.now()-typing[id]>=3900)renderChat();},4000);return;}
  if(m&&m.type==='del'){delMsg(id,m.id);return;}
  if(m&&m.type==='img'){onImg(id,m);return;}
  if(m&&m.type==='call'){onCall(id,m);return;}
  if(m&&m.type==='wp'){onWp(id,m);return;}
  if(m&&m.type==='wpimg'){onWpImg(id,m);return;}
  if(m&&m.type==='react'){if(call&&['🔥','😂','❤️','👏','🎉'].includes(m.e))floatReact(m.e);return;}
  if(m&&m.type==='sdp'){onSdp(id,m);return;}
  if(m&&m.type==='profile'){applyProfile(id,m);return;}
  if(m&&m.type==='banner'){applyBanner(id,m);return;}
  if(m&&m.type==='key'){applyKey(id,m);return;}
  if(m&&m.type==='post'){onPost(id,m);return;}
  if(m&&m.type==='phave'){onHave(id,m);return;}
  if(m&&m.type==='pdel'){S.posts=(S.posts||[]).filter(p=>!(p.id===m.id&&p.uid===id));saveData();renderForum();return;}
  if(m&&m.type==='groupinfo'){onGroupInfo(id,m.g);return;}
  if(m&&m.type==='gleave'){onGroupLeave(id,m.g);return;}
  if(m&&m.type==='gmsg'){onGroupMsg(id,m);return;}
  if(typeof m.text!=='string')return;
  if(m.id){const l=((S.seen=S.seen||{})[id]=S.seen[id]||[]);if(l.includes(m.id))return;l.push(m.id);if(l.length>300)l.shift();}
  delete typing[id];
  (S.msgs[id]=S.msgs[id]||[]).push({mine:false,id:typeof m.id==='string'?m.id.slice(0,20):undefined,em:cleanEm(m.em),text:m.text.slice(0,4000),t:m.t||Date.now()});
  if(cur===id&&!document.hidden)playSend(MGIDS.includes(m.mg)?m.mg:null);
  if(cur!==id)S.unread[id]=(S.unread[id]||0)+1;
  saveData();renderAll();
}

const RELAY='https://ntfy.sh/',L8='ABCDEFGHJKMNPQRSTUVWXYZ';
function newCode(){let c='';while(c.length<8){const b=crypto.getRandomValues(new Uint8Array(1))[0];if(b<253)c+=L8[b%23];}return c;}
const relayTopic=c=>'mesinter-'+c.toLowerCase();
async function pack(o){
  let b=new TextEncoder().encode(JSON.stringify(o)),t='p';
  if(window.CompressionStream){try{b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());t='z';}catch(e){b=new TextEncoder().encode(JSON.stringify(o));}}
  let bin='';for(const x of b)bin+=String.fromCharCode(x);return t+btoa(bin);
}
async function unpack(s){
  let b=Uint8Array.from(atob(s.slice(1)),c=>c.charCodeAt(0));
  if(s[0]==='z')b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(b));
}
async function relayPost(code,o){
  let r;try{r=await fetch(RELAY+relayTopic(code),{method:'POST',body:await pack(o)});}catch(e){throw new Error('Internet requis pour utiliser un code.');}
  if(!r.ok)throw new Error('Relais indisponible, réessaie.');
}
function relayListen(code,cb){
  const es=new EventSource(RELAY+relayTopic(code)+'/sse?since=all');
  es.onmessage=async ev=>{try{const d=JSON.parse(ev.data);if(d.event==='message'&&d.message)cb(await unpack(d.message),d.time);}catch(e){}};
  return()=>es.close();
}
let inboxStop=null,inboxCode=null;const seenReq=new Set();
function startInbox(){
  if(!S.me)return;
  if(!S.me.code){S.me.code=newCode();saveData();}
  if(inboxCode===S.me.code)return;
  if(inboxStop)inboxStop();
  inboxCode=S.me.code;inboxStop=relayListen(inboxCode,onRequest);
}
async function onRequest(m,time){
  if(!m||m.t!=='o'||!m.pid||!m.uid||m.uid===S.me.id||seenReq.has(m.pid)||Date.now()/1000-time>300)return;
  seenReq.add(m.pid);
  const code=S.me.code;
  const accept=async()=>{try{await relayPost(code,await acceptOffer(m,true));closeOverlay();toast((m.n||'Ami')+' est ajouté');}catch(e){toast(e.message||'Erreur');}};
  if(S.friends.some(f=>f.id===m.uid))return accept();
  openOverlay([h('h2',{text:(m.n||'Quelqu\'un')+' veut t\'ajouter'}),h('div',{class:'row'},
    h('button',{class:'primary',text:'Accepter',onclick:accept}),
    h('button',{text:'Refuser',onclick:()=>{relayPost(code,{t:'r',pid:m.pid}).catch(()=>{});closeOverlay();}}))]);
}
async function requestFriend(code){
  if(code===S.me.code)throw new Error('C\'est ton propre code.');
  const card=await createInvite(true),pid=card.pid;
  await relayPost(code,card);
  return new Promise((res,rej)=>{
    let stop=null;
    const end=()=>{clearTimeout(tm);if(stop)stop();};
    const tm=setTimeout(()=>{end();const c=conns[pid];if(c&&!c.uid){try{c.pc.close();}catch(e){}delete conns[pid];}rej(new Error('Pas de réponse. Ton ami doit avoir Mesinter ouvert.'));},180000);
    stop=relayListen(code,async m=>{
      if(!m||m.pid!==pid)return;
      if(m.t==='r'){end();rej(new Error('Demande refusée.'));}
      else if(m.t==='a'){end();try{res(await acceptAnswer(m,true));}catch(e){rej(e);}}
    });
  });
}

function joinTab(box){
  const scanBox=h('div',{class:'grid'});
  const inp=h('textarea',{placeholder:'Collez ici le code d\'invitation',rows:3});
  const err=h('div',{class:'err'});
  const out=h('div',{class:'grid'});
  const run=async code=>{
    out.replaceChildren();err.textContent='';
    try{
      const reply=await acceptOffer(code.trim());
      out.replaceChildren(h('p',{class:'muted',text:'3. Envoyez cette réponse à votre ami. La connexion se fait dès qu\'il la colle.'}),codeBox(reply));
      renderAll();
    }catch(e){err.textContent=e.message||'Code invalide';}
  };
  const kids=[h('p',{class:'muted',text:'1. Recevez l\'invitation de votre ami, puis scannez-la ou collez-la.'})];
  if('BarcodeDetector' in window&&navigator.mediaDevices){
    kids.push(h('button',{text:'Scanner avec la caméra',onclick:()=>{
      if(stopCam)stopCam();
      scanCamera(c=>run(c),scanBox).then(s=>{stopCam=s;});
    }}));
  }
  box.append(...kids,scanBox,inp,
    h('button',{class:'primary',text:'Générer ma réponse',onclick:()=>run(inp.value)}),err,out);
}
async function scanCamera(onCode,box){
  const video=h('video',{playsinline:true,muted:true,autoplay:true,style:'width:100%;border-radius:14px;background:#000'});
  box.replaceChildren(video,h('p',{class:'muted',text:'Pointez la caméra vers le code QR de votre ami.'}));
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}
  catch(e){box.replaceChildren(h('p',{class:'err',text:'Caméra refusée ou indisponible. Collez le code à la place.'}));return null;}
  video.srcObject=stream;
  const det=new BarcodeDetector({formats:['qr_code']});
  let done=false;
  const stop=()=>{done=true;stream.getTracks().forEach(t=>t.stop());};
  const tick=async()=>{
    if(done)return;
    if(!video.isConnected){stop();return;}
    try{const codes=await det.detect(video);if(codes.length){stop();onCode(codes[0].rawValue);return;}}catch(e){}
    setTimeout(tick,250);
  };
  video.addEventListener('loadeddata',tick,{once:true});
  return stop;
}

function squarePhoto(file,size){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
      const c=document.createElement('canvas');c.width=c.height=size;
      c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,size,size);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Image illisible'));};
    img.src=url;
  });
}
function cropPhoto(file,w,hh){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const k=Math.max(w/img.width,hh/img.height),sw=w/k,sh=hh/k,c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,w,hh);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.75));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Image illisible'));};img.src=url;});}

async function askClaude(messages){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:CLAUDE_MODEL,max_tokens:1024,system:'Tu es Mesinter IA, un assistant intégré à l\'application de messagerie Mesinter. Réponds en français, de façon claire et concise.',messages})
  });
  if(!r.ok){
    let detail='';try{detail=(await r.json()).error.message;}catch(e){}
    throw new Error('Erreur '+r.status+(detail?' : '+detail:''));
  }
  const data=await r.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim()||'(réponse vide)';
}
function buildHistory(list){
  const out=[];
  for(const m of list){
    if(m.pending||!m.text)continue;
    const role=m.mine?'user':'assistant';
    if(out.length&&out[out.length-1].role===role)out[out.length-1].content+='\n'+m.text;
    else out.push({role,content:m.text});
  }
  while(out.length&&out[0].role!=='user')out.shift();
  return out.slice(-30);
}
let claudeBusy=false;
async function sendToClaude(text){
  if(claudeBusy)return toast('Mesinter IA répond encore…');
  const list=S.msgs.claude=S.msgs.claude||[];
  list.push({mine:true,text,t:Date.now(),ok:true});
  const reply={mine:false,text:'…',t:Date.now(),pending:true};
  list.push(reply);
  saveData();renderAll();
  if(!S.apiKey){reply.text='Ajoutez votre clé API dans l\'accueil pour me parler.';}
  else{
    claudeBusy=true;
    try{reply.text=await askClaude(buildHistory(list.slice(0,-1)));}
    catch(e){reply.text=(navigator.onLine?'':'Pas de connexion Internet. ')+(e.message||'Erreur de connexion à Mesinter IA.');}
    finally{claudeBusy=false;}
  }
  reply.pending=false;reply.t=Date.now();
  saveData();renderAll();
}

/* ---------- Groupes : chaque membre est relié directement aux autres membres connectés ---------- */
function groupMembers(g){return (g.members||[]).filter(u=>u!==S.me.id);}
function memberFriends(g){return groupMembers(g).map(u=>S.friends.find(x=>x.id===u&&!x.group)).filter(Boolean);}
function groupOnline(g){return groupMembers(g).filter(u=>{const c=connOf(u);return c&&c.state==='live';}).length;}
function groupSend(obj,uids){
  let n=0;
  for(const u of uids){const c=connOf(u);if(c&&c.dc&&c.dc.readyState==='open'){try{c.dc.send(JSON.stringify(obj));n++;}catch(e){}}}
  return n;
}
function groupInfoMsg(g){return {type:'groupinfo',g:{id:g.id,name:g.name,hue:g.hue,members:g.members}};}
function sendGroupsTo(c){
  if(!c.uid||!c.dc||c.dc.readyState!=='open')return;
  for(const g of S.friends.filter(f=>f.group&&f.members.includes(c.uid))){
    try{c.dc.send(JSON.stringify(groupInfoMsg(g)));}catch(e){}
  }
}
function onGroupInfo(uid,g){
  if(!g||typeof g.id!=='string'||!Array.isArray(g.members))return;
  if(!g.members.includes(S.me.id)||!g.members.includes(uid))return;
  const members=g.members.filter(x=>typeof x==='string').slice(0,50);
  const ex=S.friends.find(x=>x.id===g.id);
  if(ex){
    ex.members=members;
    if(typeof g.name==='string')ex.name=g.name.slice(0,40);
    if(typeof g.hue==='number')ex.hue=g.hue;
  }else{
    S.friends.push({id:g.id,name:typeof g.name==='string'?g.name.slice(0,40):'Groupe',hue:typeof g.hue==='number'?g.hue:200,group:true,members,since:Date.now()});
    S.msgs[g.id]=S.msgs[g.id]||[];
  }
  saveData();renderAll();
}
function onGroupLeave(uid,gid){
  const g=S.friends.find(x=>x.id===gid&&x.group);
  if(!g||!g.members.includes(uid))return;
  g.members=g.members.filter(x=>x!==uid);
  saveData();renderAll();
}
function onGroupMsg(uid,m){
  const g=S.friends.find(x=>x.id===m.g&&x.group);
  if(!g||!g.members.includes(uid)||typeof m.text!=='string')return;
  (S.msgs[g.id]=S.msgs[g.id]||[]).push({mine:false,text:m.text.slice(0,4000),t:m.t||Date.now(),from:String(m.from||'').slice(0,30)});
  if(cur!==g.id)S.unread[g.id]=(S.unread[g.id]||0)+1;
  saveData();renderAll();
}
function sendGroup(g,text){
  const m={mine:true,text,t:Date.now(),ok:false,from:S.me.name};
  (S.msgs[g.id]=S.msgs[g.id]||[]).push(m);
  saveData();
  m.ok=groupSend({type:'gmsg',g:g.id,text,t:m.t,from:S.me.name},groupMembers(g))>0;
  saveData();renderAll();
}
function removeGroup(gid){
  S.friends=S.friends.filter(x=>x.id!==gid);
  delete S.msgs[gid];delete S.unread[gid];delete S.nick[gid];
  if(cur===gid)cur=null;
  saveData();renderAll();
}
function pickList(items,picks){
  return h('div',{class:'grid menu'},...items.map(f=>{
    const b=h('button',{text:friendName(f),onclick:()=>{
      if(picks.has(f.id)){picks.delete(f.id);b.classList.remove('primary');}
      else{picks.add(f.id);b.classList.add('primary');}
    }});
    return b;
  }));
}
function openNewGroup(){
  if(!S.me)return askProfile(openNewGroup);
  const friends=S.friends.filter(f=>!f.group&&!f.ai);
  if(friends.length<2)return toast('Ajoutez au moins 2 amis pour créer un groupe');
  const name=h('input',{placeholder:'Nom du groupe',maxLength:40});
  const picks=new Set();
  openOverlay([header('Nouveau groupe'),name,
    h('p',{class:'muted',text:'Choisissez au moins 2 amis. Les messages passent directement entre les membres connectés.'}),
    pickList(friends,picks),
    h('button',{class:'primary',text:'Créer le groupe',onclick:()=>{
      if(picks.size<2)return toast('Choisissez au moins 2 amis');
      const g={id:'g'+rnd(12),name:(name.value.trim()||'Groupe').slice(0,40),hue:Math.floor(Math.random()*360),group:true,members:[S.me.id,...picks],since:Date.now()};
      S.friends.push(g);S.msgs[g.id]=[];saveData();
      groupSend(groupInfoMsg(g),groupMembers(g));
      closeOverlay();openChat(g.id);
    }})]);
  setTimeout(()=>name.focus(),50);
}
function openGroupMenu(g){
  const showMembers=()=>{
    const rows=[h('div',{class:'row',style:'justify-content:space-between'},h('span',{text:'Vous'}),h('span',{class:'muted',text:S.me.name}))];
    for(const p of memberFriends(g)){
      const st=connOf(p.id)&&connOf(p.id).state==='live'?'en ligne':'hors ligne';
      rows.push(h('div',{class:'row',style:'justify-content:space-between'},h('span',{text:friendName(p)}),h('span',{class:'muted',text:st})));
    }
    openOverlay([header('Membres de '+g.name),h('div',{class:'grid'},...rows)]);
  };
  const addMembers=()=>{
    const candidates=S.friends.filter(f=>!f.group&&!f.ai&&!g.members.includes(f.id));
    if(!candidates.length)return toast('Aucun ami à ajouter');
    const picks=new Set();
    openOverlay([header('Ajouter au groupe'),pickList(candidates,picks),
      h('button',{class:'primary',text:'Ajouter',onclick:()=>{
        if(!picks.size)return;
        g.members=[...new Set([...g.members,...picks])];saveData();
        groupSend(groupInfoMsg(g),groupMembers(g));
        closeOverlay();renderAll();renderChat();toast('Membres ajoutés');
      }})]);
  };
  const rename=()=>{
    const inp=h('input',{value:g.name,maxLength:40});
    openOverlay([header('Renommer le groupe'),inp,
      h('button',{class:'primary',text:'Enregistrer',onclick:()=>{
        const v=inp.value.trim();if(!v)return;
        g.name=v;saveData();groupSend(groupInfoMsg(g),groupMembers(g));
        closeOverlay();renderAll();renderChat();
      }})]);
  };
  const leave=()=>{
    if(!confirm('Quitter le groupe « '+g.name+' » ?'))return;
    groupSend({type:'gleave',g:g.id},groupMembers(g));
    removeGroup(g.id);closeOverlay();$('app').classList.remove('open');
  };
  openOverlay([header(g.name),
    h('div',{class:'grid menu'},
      h('button',{text:'Voir les membres',onclick:showMembers}),
      h('button',{text:'Ajouter des membres',onclick:addMembers}),
      h('button',{text:'Renommer le groupe',onclick:rename}),
      h('button',{text:'Exporter la conversation (.txt)',onclick:()=>exportChat(g)}),
      h('button',{text:'Effacer la conversation',onclick:()=>{if(confirm('Effacer les messages du groupe ?')){S.msgs[g.id]=[];saveData();closeOverlay();renderAll();}}}),
      h('button',{class:'danger',text:'Quitter le groupe',onclick:leave})
    )]);
}

/* ---------- Plein écran et quitter ---------- */
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function updFs(){const b=$('fsBtn');if(b)b.textContent=fsOn()?'Quitter le plein écran':'Plein écran';}
function toggleFull(){
  const nope=()=>toast('Plein écran non disponible sur cet appareil');
  try{
    if(fsOn()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{
      const req=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
      if(!req)return nope();
      const p=req.call(document.documentElement);
      if(p&&p.catch)p.catch(nope);
    }
  }catch(e){nope();}
  setTimeout(updFs,300);
}
document.addEventListener('fullscreenchange',updFs);
document.addEventListener('webkitfullscreenchange',updFs);
function quitApp(){
  try{if(fsOn())(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}
  try{window.close();}catch(e){}
  setTimeout(()=>{
    document.body.innerHTML='<div style="font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center;background:#0b0d12;color:#e8eaf0"><div>Mesinter est fermé.<br><br><a href="." style="color:#8ab4ff">Rouvrir Mesinter</a><br><br>Vous pouvez aussi fermer cet onglet.<br>Vos conversations sont conservées sur cet appareil.</div></div>';
  },250);
}
$('fsBtn').onclick=toggleFull;
$('quitBtn').onclick=quitApp;
updFs();

ensureClaude();
for(const f of S.friends)relaySub(f);
startInbox();
const flushAll=()=>{for(const f of S.friends)if(!f.group&&!f.ai)flushPending(f.id);reconnectAll();};
addEventListener('online',flushAll);document.addEventListener('visibilitychange',()=>{if(!document.hidden)flushAll();});
document.body.classList.add('boot');setTimeout(()=>document.body.classList.remove('boot'),1600);
buildForum();
applyAccent();
renderAll();
if(!S.me)askProfile(showLaunch);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
